<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigma Embedded Workbook</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #sigma {
      width: 100%;
      height: 100vh;
      border: 0;
    }

    #error {
      padding: 20px;
      color: #b00020;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="error"></div>

  <iframe
    id="sigma"
    title="Sigma workbook"
    allowfullscreen>
  </iframe>

  <script>
    async function loadSigma() {
      try {
        const response = await fetch("/.netlify/functions/sigma-url");
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Unable to generate Sigma URL");
        }

        document.getElementById("sigma").src = result.url;
      } catch (error) {
        document.getElementById("error").textContent =
          `Error loading Sigma: ${error.message}`;
      }
    }

    loadSigma();
  </script>
</body>
</html>
